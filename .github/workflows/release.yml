name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=${GITHUB_REF_NAME} \
            --build-arg COMMIT=${GITHUB_SHA} \
            --build-arg BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t kanpic:${GITHUB_REF_NAME} \
            -t ghcr.io/hkjang/kanpic:${GITHUB_REF_NAME} .
          docker push ghcr.io/hkjang/kanpic:${GITHUB_REF_NAME}
      - name: Create offline bundle
        run: |
          mkdir -p dist
          docker save kanpic:${GITHUB_REF_NAME} ghcr.io/hkjang/kanpic:${GITHUB_REF_NAME} | gzip -9 > dist/kanpic-${GITHUB_REF_NAME}.tar.gz
          cd dist
          sha256sum kanpic-${GITHUB_REF_NAME}.tar.gz > kanpic-${GITHUB_REF_NAME}.tar.gz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/kanpic-${{ github.ref_name }}.tar.gz
            dist/kanpic-${{ github.ref_name }}.tar.gz.sha256
